<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragonForceShell V2.6 &mdash; Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(77,124,255,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(139,92,246,0.08) 0%, transparent 50%),
      radial-gradient(1000px 600px at 50% -10%, #2a2303 0%, #171502 45%, #000 100%);
    font-family: 'Orbitron', monospace;
    color: #FFD700;
    padding: 20px;
  }

  .dfs-card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 32px 32px;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.5),
      0 0 60px rgba(77,124,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.04);
    animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dfs-card img.logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 16px;
    border: 2px solid rgba(77,124,255,0.5);
    box-shadow: 0 0 20px rgba(77,124,255,0.15);
    transition: box-shadow var(--transition, 250ms);
  }

  .dfs-card img.logo:hover {
    box-shadow: 0 0 30px rgba(77,124,255,0.3);
  }

  .dfs-badge {
    font-size: 28px;
    letter-spacing: 4px;
    color: #4d7cff;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .dfs-badge span { color: #f43f5e; }

  .dfs-card h1 {
    font-size: 16px;
    letter-spacing: 3px;
    color: #FFD700;
    font-weight: 500;
    margin: 4px 0 2px;
  }

  .dfs-card p.sub {
    font-size: 10px;
    letter-spacing: 2px;
    color: #6b7094;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .dfs-card form { text-align: left; }

  .dfs-card label.lbl {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .pw-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .pw-row input[type=password],
  .pw-row input[type=text] {
    flex: 1;
    height: 46px;
    padding: 0 14px;
    font-size: 16px;
    letter-spacing: 2px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: #FFD700;
    outline: none;
    font-family: inherit;
    transition: all 200ms;
  }

  .pw-row input:focus {
    border-color: #4d7cff;
    box-shadow: 0 0 0 3px rgba(77,124,255,0.12);
  }

  #pwToggle {
    width: 48px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.03);
    color: #FFD700;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 200ms;
  }

  #pwToggle:hover { background: rgba(255,255,255,0.08); }

  #capsWarn {
    display: none;
    font-size: 10px;
    color: #ff9d00;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  input[type=submit] {
    width: 100%;
    height: 48px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #2b2470, #191645);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    transition: all 250ms;
    box-shadow: 0 4px 16px rgba(77,124,255,0.15);
  }

  input[type=submit]:hover {
    filter: brightness(1.2);
    box-shadow: 0 4px 24px rgba(77,124,255,0.3);
    transform: translateY(-1px);
  }

  input[type=submit]:active { transform: translateY(0); }

  .dfs-foot {
    margin-top: 20px;
    font-size: 9px;
    letter-spacing: 1px;
    color: #444;
  }

  .dfs-foot b { color: #666; }
</style>
</head>
<body>
  <div class="dfs-card">
    <img class="logo" src="https://raw.githubusercontent.com/EagleTube/DFS/main/images/logoritma.png" alt="" onerror="this.style.display='none'">
    <div class="dfs-badge">DFS <span>V2.6</span></div>
    <h1>DragonForceShell</h1>
    <p class="sub">RESTRICTED ACCESS &mdash; AUTHORIZED ONLY</p>
    <form action="" method="POST" autocomplete="off">
      <label class="lbl" for="dfsPass">PASSWORD</label>
      <div class="pw-row">
        <input id="dfsPass" type="password" name="password" required autofocus placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;">
        <button type="button" id="pwToggle" title="Show / hide password">&#128065;</button>
      </div>
      <p id="capsWarn">&#9888; Caps Lock is ON</p>
      <input type="submit" name="login" value="UNLOCK &#10148;">
    </form>
    <p class="dfs-foot">Coded by <b>EagleEye</b> &mdash; v2.6 hardened</p>
  </div>
<script>
  (function(){
    var pw = document.getElementById('dfsPass');
    var tg = document.getElementById('pwToggle');
    var caps = document.getElementById('capsWarn');
    if(pw) pw.focus();
    if(tg && pw){
      tg.addEventListener('click', function(){
        pw.type = (pw.type === 'password') ? 'text' : 'password';
        pw.focus();
      });
    }
    if(pw && caps && pw.addEventListener){
      ['keyup','keydown'].forEach(function(ev){
        pw.addEventListener(ev, function(e){
          try{ caps.style.display = (e.getModifierState && e.getModifierState('CapsLock')) ? 'block' : 'none'; }
          catch(_){}
        });
      });
    }
  })();
</script>
</body>
</html>
