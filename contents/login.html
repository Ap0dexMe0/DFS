<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragonForceShell V2.6 &mdash; Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;900&display=swap');

  :root {
    --bg-primary: #06060e;
    --bg-secondary: #0b0b18;
    --accent: #4d7cff;
    --accent-hover: #6b93ff;
    --accent-dim: rgba(77, 124, 255, 0.12);
    --accent-glow: rgba(77, 124, 255, 0.20);
    --accent-secondary: #00d4ff;
    --violet: #8b5cf6;
    --gold: #FFD700;
    --gold-dim: rgba(255, 215, 0, 0.10);
    --red: #f43f5e;
    --ink: #e8e8f0;
    --mut: #6b7094;
    --card-brd: rgba(255, 255, 255, 0.07);
    --input-brd: rgba(255, 255, 255, 0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(77,124,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 50%),
      radial-gradient(1000px 600px at 50% -10%, rgba(30,20,80,0.4) 0%, var(--bg-secondary) 45%, var(--bg-primary) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: rgba(12, 12, 30, 0.72);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    border: 1px solid var(--card-brd);
    border-radius: var(--radius-xl);
    padding: 44px 36px 36px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.45),
      0 0 60px rgba(77,124,255,0.05),
      inset 0 1px 0 rgba(255,255,255,0.04);
    animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Glass shine overlay */
  .login-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Animated gradient line at top */
  .login-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--violet), var(--accent-secondary), var(--accent));
    background-size: 300% 100%;
    animation: gradientShift 4s ease infinite;
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes subtlePulse {
    0%, 100% { box-shadow: 0 0 16px rgba(77,124,255,0.15); }
    50%      { box-shadow: 0 0 28px rgba(77,124,255,0.30); }
  }

  .login-card .logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 18px;
    border: 2px solid rgba(77,124,255,0.5);
    box-shadow: 0 0 20px rgba(77,124,255,0.15);
    animation: subtlePulse 3s ease-in-out infinite;
  }

  .login-card .logo:hover {
    box-shadow: 0 0 32px rgba(77,124,255,0.35);
    transform: scale(1.03);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .brand-badge {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
    font-weight: 900;
    margin-bottom: 4px;
  }

  .brand-badge span { color: var(--red); }

  .login-card h1 {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 600;
    margin: 6px 0 4px;
  }

  .login-card p.sub {
    font-size: 9.5px;
    letter-spacing: 3px;
    color: var(--mut);
    margin-bottom: 32px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .login-card form { text-align: left; }

  .login-card label.lbl {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--mut);
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .pw-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .pw-row input[type=password],
  .pw-row input[type=text] {
    flex: 1;
    height: 48px;
    padding: 0 16px;
    font-size: 16px;
    letter-spacing: 3px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    color: var(--gold);
    outline: none;
    font-family: 'Orbitron', monospace;
    transition: all 200ms ease;
  }

  .pw-row input:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.12);
  }

  .pw-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    background: rgba(255,255,255,0.06);
  }

  #pwToggle {
    width: 50px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    cursor: pointer;
    background: rgba(255,255,255,0.03);
    color: var(--gold);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 200ms ease;
  }

  #pwToggle:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--accent);
  }

  #capsWarn {
    display: none;
    font-size: 10px;
    color: #f59e0b;
    margin-top: 6px;
    letter-spacing: 1px;
    font-weight: 500;
  }

  input[type=submit].login-btn {
    width: 100%;
    height: 50px;
    margin-top: 20px;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    background: linear-gradient(135deg, #4d7cff, #6c5ce7);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 20px rgba(77,124,255,0.2);
    position: relative;
    overflow: hidden;
  }

  input[type=submit].login-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    pointer-events: none;
  }

  input[type=submit].login-btn:hover {
    filter: brightness(1.15);
    box-shadow: 0 6px 32px rgba(77,124,255,0.35);
    transform: translateY(-2px);
  }

  input[type=submit].login-btn:active {
    transform: translateY(0);
    filter: brightness(0.95);
  }

  .login-foot {
    margin-top: 24px;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #3a3d5c;
  }

  .login-foot b { color: #6b7094; }

  /* Focus-visible for accessibility */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card { padding: 36px 24px 28px; }
    .brand-badge { font-size: 24px; letter-spacing: 3px; }
    .pw-row input { font-size: 14px; letter-spacing: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="login-card" role="main">
    <img class="logo" src="https://raw.githubusercontent.com/EagleTube/DFS/main/images/logoritma.png" alt="DragonForceShell Logo" onerror="this.style.display='none'">
    <div class="brand-badge" aria-hidden="true">DFS <span>V2.6</span></div>
    <h1>DragonForceShell</h1>
    <p class="sub">RESTRICTED ACCESS &mdash; AUTHORIZED ONLY</p>
    <form action="" method="POST" autocomplete="off">
      <label class="lbl" for="dfsPass">PASSWORD</label>
      <div class="pw-row">
        <input id="dfsPass" type="password" name="password" required autofocus placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" aria-describedby="capsWarn">
        <button type="button" id="pwToggle" title="Show / hide password" aria-label="Toggle password visibility">&#128065;</button>
      </div>
      <p id="capsWarn" role="alert">&#9888; Caps Lock is ON</p>
      <input type="submit" class="login-btn" name="login" value="UNLOCK &#10148;">
    </form>
    <p class="login-foot">Coded by <b>EagleEye</b> &mdash; v2.6 hardened</p>
  </div>
<script>
  (function(){
    var pw = document.getElementById('dfsPass');
    var tg = document.getElementById('pwToggle');
    var caps = document.getElementById('capsWarn');
    if(pw) pw.focus();
    if(tg && pw){
      tg.addEventListener('click', function(){
        pw.type = (pw.type === 'password') ? 'text' : 'password';
        pw.focus();
      });
    }
    if(pw && caps && pw.addEventListener){
      ['keyup','keydown'].forEach(function(ev){
        pw.addEventListener(ev, function(e){
          try{ caps.style.display = (e.getModifierState && e.getModifierState('CapsLock')) ? 'block' : 'none'; }
          catch(_){}
        });
      });
    }
  })();
</script>
</body>
</html>
